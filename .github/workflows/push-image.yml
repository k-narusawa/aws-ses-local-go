name: Build and Push to Docker Hub

on:
  workflow_dispatch:

jobs:
  ko:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: ko-build/setup-ko@v0.9
        with:
          version: v0.19.1

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get tag name
        run: |
          TAG=${GITHUB_REF##*/}
          if [ -z "$TAG" ]; then
            TAG="latest"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV

      # QEMU / Docker を使わず Go のクロスコンパイルで amd64 / arm64 をビルドして push する
      # (ベースイメージ・対象プラットフォームは .ko.yaml を参照)
      - name: Build and push
        env:
          KO_DOCKER_REPO: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/aws-ses-local-go
        run: |
          ko build ./app \
            --bare \
            --tags "${TAG}" \
            --sbom=none \
            --image-label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --image-label org.opencontainers.image.revision=${{ github.sha }}
